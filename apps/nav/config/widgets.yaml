- logo:
    icon: /icons/dlc-logo.svg
- search:
    provider: baidu
    target: _blank
- datetime:
    text_size: xl
    locale: zh-CN
    format:
      dateStyle: short
      timeStyle: short
      hourCycle: h23
- openmeteo:
    label: 上海
    latitude: "{{HOMEPAGE_VAR_LATITUDE}}"
    longitude: "{{HOMEPAGE_VAR_LONGITUDE}}"
    timezone: Asia/Shanghai
    units: metric
    cache: 10
