<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DLC 空间</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; color: #e9fffb; background: radial-gradient(circle at 18% 12%, #0c766c66, transparent 32%), radial-gradient(circle at 82% 4%, #176b8a55, transparent 30%), linear-gradient(145deg, #031019, #071b25 55%, #03151c); }
      main { width: min(1050px, calc(100% - 32px)); margin: auto; padding: 72px 0; }
      header { display: flex; gap: 18px; align-items: center; margin-bottom: 42px; }
      header img { width: 64px; height: 64px; filter: drop-shadow(0 0 20px #38e8c477); }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); letter-spacing: -.04em; }
      header p { margin: 6px 0 0; color: #9acbc5; }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
      a { min-height: 150px; padding: 24px; color: inherit; text-decoration: none; border: 1px solid #70e7d12e; border-radius: 20px; background: linear-gradient(145deg, #16313b99, #09212b99); box-shadow: 0 18px 50px #0007; backdrop-filter: blur(18px); transition: transform .2s ease, border-color .2s ease; }
      a:hover, a:focus-visible { transform: translateY(-4px); border-color: #55e8cd99; outline: none; }
      strong { display: block; margin-bottom: 14px; font-size: 1.25rem; }
      span { color: #9acbc5; line-height: 1.6; }
      footer { margin-top: 34px; color: #6fa49e; font-size: .9rem; }
      @media (max-width: 760px) { main { padding: 42px 0; } .grid { grid-template-columns: 1fr; } a { min-height: 116px; } }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <header><img src="./dlc-logo.svg" alt="DLC" /><div><h1>DLC 空间</h1><p>戴乐成的个人数字入口</p></div></header>
      <section class="grid" aria-label="站点入口">
        <a href="https://dailecheng.xyz/"><strong>主页</strong><span>个人主页与数字空间总览</span></a>
        <a href="https://blog.dailecheng.xyz/"><strong>博客</strong><span>记录技术实践与生活片段</span></a>
        <a href="https://pan.dailecheng.xyz/"><strong>网盘</strong><span>私有文件空间</span></a>
        <a href="https://web.dailecheng.xyz/"><strong>网址集</strong><span>常用网站与资源收藏</span></a>
        <a href="https://hot.dailecheng.xyz/"><strong>今日热榜</strong><span>聚合今日热点</span></a>
        <a href="https://audio.dailecheng.xyz/"><strong>音乐站</strong><span>聆听喜欢的音乐</span></a>
      </section>
      <footer>极光深海 · DLC</footer>
    </main>
  </body>
</html>
